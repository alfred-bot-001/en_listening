[project]
name = "listenflow-api"
version = "0.1.0"
description = "Python FastAPI backend for English listening practice."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "dramatiq[redis]>=1.17.0",
    "faster-whisper>=1.0.0",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.0",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listenflow"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Contains an intentional Chinese LLM prompt with full-width punctuation
# (RUF001/002/003) and long prose lines (E501).
"src/listenflow/workers/keyword_analyzer.py" = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["listenflow"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = []

# Third-party libraries that ship no type information.
[[tool.mypy.overrides]]
module = ["yt_dlp", "faster_whisper", "dramatiq", "dramatiq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=listenflow --cov-report=term-missing"

