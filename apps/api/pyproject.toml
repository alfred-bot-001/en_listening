[project]
name = "listenflow-api"
version = "0.1.0"
description = "Python FastAPI backend for English listening practice."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "dramatiq[redis]>=1.17.0",
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listenflow"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["listenflow"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=listenflow --cov-report=term-missing"

