services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: listenflow
      POSTGRES_PASSWORD: listenflow
      POSTGRES_DB: listenflow
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"

volumes:
  postgres_data:

